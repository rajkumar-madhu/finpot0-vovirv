<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedEye Voice Agent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-deep:#080b10;
  --bg-mid:#0d1117;
  --glass:rgba(13,17,23,.55);
  --glass-border:rgba(0,188,212,.08);
  --glass-highlight:rgba(0,188,212,.04);
  --cyan:#00bcd4;
  --cyan-dim:rgba(0,188,212,.35);
  --cyan-glow:rgba(0,188,212,.12);
  --teal:#0097a7;
  --text:#e6edf3;
  --text-dim:#6e7681;
  --user-bubble:rgba(0,188,212,.07);
  --ai-bubble:rgba(255,255,255,.03);
  --danger:#f85149;
  --success:#3fb950;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'Space Mono',monospace;
}

html,body{height:100%;overflow:hidden}

body{
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--text);
  display:flex;flex-direction:column;
}

/* ── Atmospheric background ─────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 20% 0%,rgba(0,188,212,.06),transparent),
    radial-gradient(ellipse 50% 60% at 85% 100%,rgba(0,151,167,.04),transparent),
    radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 40%,var(--bg-deep));
}

/* ── Top bar ────────────────────────────────────────────── */
.topbar{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1.5rem;
  background:var(--glass);
  border-bottom:1px solid var(--glass-border);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}

.topbar-brand{display:flex;align-items:center;gap:.6rem}
.topbar-brand svg{width:28px;height:28px}
.topbar-brand h1{font-size:.95rem;font-weight:700;letter-spacing:-.02em;color:var(--cyan)}
.topbar-brand span{font-size:.7rem;color:var(--text-dim);font-family:var(--font-mono);margin-left:.25rem}

.status-pill{
  display:flex;align-items:center;gap:.4rem;
  padding:.3rem .7rem;border-radius:100px;
  font-size:.7rem;font-weight:500;font-family:var(--font-mono);
  background:rgba(0,188,212,.06);border:1px solid rgba(0,188,212,.12);color:var(--cyan);
  transition:all .3s;
}
.status-pill::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 6px var(--cyan);
  animation:blink 2s infinite;
}
.status-pill.error{color:var(--danger);background:rgba(248,81,73,.06);border-color:rgba(248,81,73,.15)}
.status-pill.error::before{background:var(--danger);box-shadow:0 0 6px var(--danger)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ── Chat area ──────────────────────────────────────────── */
.chat-wrap{
  position:relative;z-index:5;
  flex:1;overflow-y:auto;
  padding:1.5rem 1rem 1rem;
  display:flex;flex-direction:column;gap:.75rem;
  scroll-behavior:smooth;
}

.chat-wrap::-webkit-scrollbar{width:4px}
.chat-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:10px}

/* ── Chat bubbles ───────────────────────────────────────── */
.msg{
  max-width:78%;padding:.75rem 1rem;border-radius:14px;
  line-height:1.55;font-size:.88rem;
  opacity:0;transform:translateY(8px);
  animation:msgIn .35s ease forwards;
}
@keyframes msgIn{to{opacity:1;transform:translateY(0)}}

.msg.user{
  align-self:flex-end;
  background:var(--user-bubble);
  border:1px solid rgba(0,188,212,.12);
  border-bottom-right-radius:4px;
}
.msg.user .label{color:var(--cyan)}

.msg.ai{
  align-self:flex-start;
  background:var(--ai-bubble);
  border:1px solid rgba(255,255,255,.05);
  border-bottom-left-radius:4px;
}
.msg.ai .label{color:var(--text-dim)}

.msg .label{
  font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  font-family:var(--font-mono);margin-bottom:.3rem;display:block;
}

.msg .meta{
  margin-top:.35rem;display:flex;align-items:center;gap:.5rem;
  font-size:.62rem;color:var(--text-dim);font-family:var(--font-mono);
}

.msg audio{
  margin-top:.5rem;width:100%;height:32px;border-radius:8px;
  filter:brightness(.8);
}

/* status messages */
.msg.status{
  align-self:center;max-width:100%;
  background:transparent;border:none;padding:.25rem 0;
  font-size:.72rem;color:var(--text-dim);font-family:var(--font-mono);
  text-align:center;letter-spacing:.02em;
}

/* ── Empty state ────────────────────────────────────────── */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
  opacity:.45;user-select:none;pointer-events:none;
}
.empty-state svg{width:56px;height:56px;color:var(--cyan);opacity:.4}
.empty-state p{font-size:.82rem;color:var(--text-dim);text-align:center;line-height:1.6}
.empty-state .hotkey{
  font-family:var(--font-mono);font-size:.65rem;
  padding:.15rem .45rem;border-radius:5px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);
  color:var(--text-dim);
}

/* ── Bottom controls ────────────────────────────────────── */
.controls{
  position:relative;z-index:10;
  padding:1rem 1rem 1.25rem;
  display:flex;align-items:center;justify-content:center;gap:1rem;
  background:linear-gradient(to top,var(--bg-deep) 60%,transparent);
}

/* Mic button */
.mic-btn{
  width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--teal));
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  transition:transform .2s,box-shadow .3s;
  box-shadow:0 0 0 0 var(--cyan-dim),0 4px 20px rgba(0,188,212,.15);
}
.mic-btn:hover{transform:scale(1.06)}
.mic-btn:active{transform:scale(.97)}
.mic-btn svg{width:28px;height:28px;position:relative;z-index:2;transition:opacity .2s}

/* Recording state */
.mic-btn.recording{
  background:linear-gradient(135deg,var(--danger),#c62828);
  animation:pulse 1.4s ease-in-out infinite;
  box-shadow:0 0 0 0 rgba(248,81,73,.4),0 4px 20px rgba(248,81,73,.2);
}
.mic-btn.recording svg.mic-icon{opacity:0;position:absolute}
.mic-btn.recording svg.stop-icon{opacity:1}
.mic-btn:not(.recording) svg.stop-icon{opacity:0;position:absolute}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(248,81,73,.45),0 4px 20px rgba(248,81,73,.2)}
  70%{box-shadow:0 0 0 18px rgba(248,81,73,0),0 4px 20px rgba(248,81,73,.2)}
  100%{box-shadow:0 0 0 0 rgba(248,81,73,0),0 4px 20px rgba(248,81,73,.2)}
}

/* Ring behind mic */
.mic-btn::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid var(--cyan-dim);opacity:.5;
  transition:border-color .3s,opacity .3s;
}
.mic-btn.recording::before{border-color:rgba(248,81,73,.3)}

/* Secondary buttons */
.ctrl-btn{
  width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.03);color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.ctrl-btn:hover{background:var(--cyan-glow);color:var(--cyan);border-color:rgba(0,188,212,.15)}
.ctrl-btn svg{width:18px;height:18px}

/* Waveform visualiser (thin bar row) */
.visualiser{
  display:flex;align-items:center;gap:2px;height:28px;
  position:absolute;left:50%;top:-36px;transform:translateX(-50%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.visualiser.active{opacity:1}
.visualiser span{
  width:3px;border-radius:2px;background:var(--cyan);
  height:4px;transition:height .08s;
}

/* ── Responsive ─────────────────────────────────────────── */
@media(min-width:640px){
  .chat-wrap{padding:2rem 15% 1.5rem}
  .msg{max-width:60%}
}

@media(max-width:380px){
  .mic-btn{width:60px;height:60px}
  .mic-btn svg{width:24px;height:24px}
}
</style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="topbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--cyan)"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    <h1>Voice Agent<span>v1.0</span></h1>
  </div>
  <div class="status-pill" id="statusPill">Connecting&hellip;</div>
</header>

<!-- Chat -->
<div class="chat-wrap" id="chatWrap">
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    <p>Tap the mic to start speaking.<br>Your voice will be transcribed, processed, and read back.<br><br>Hold <span class="hotkey">Space</span> for push-to-talk.</p>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <div class="visualiser" id="visualiser"></div>

  <button class="ctrl-btn" id="clearBtn" title="Clear chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
  </button>

  <button class="mic-btn" id="micBtn" title="Hold to record">
    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>

  <button class="ctrl-btn" id="muteBtn" title="Mute audio playback">
    <svg id="speakerIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
  </button>
</div>

<script>
(() => {
  // ── DOM ───────────────────────────────────────────────
  const chatWrap   = document.getElementById('chatWrap');
  const emptyState = document.getElementById('emptyState');
  const micBtn     = document.getElementById('micBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const muteBtn    = document.getElementById('muteBtn');
  const statusPill = document.getElementById('statusPill');
  const visEl      = document.getElementById('visualiser');

  // ── State ─────────────────────────────────────────────
  let ws = null;
  let recorder = null;
  let recording = false;
  let muted = false;
  let audioCtx = null;
  let analyser = null;
  let stream = null;
  let visRaf = null;
  let hasMessages = false;
  let pendingAudioReply = null; // text element waiting for audio

  // ── Visualiser bars ───────────────────────────────────
  const BAR_COUNT = 24;
  for (let i = 0; i < BAR_COUNT; i++) { const s = document.createElement('span'); visEl.appendChild(s); }
  const bars = visEl.querySelectorAll('span');

  function drawVisualiser() {
    if (!analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const step = Math.floor(data.length / BAR_COUNT);
    bars.forEach((b, i) => {
      const v = data[i * step] / 255;
      b.style.height = Math.max(3, v * 28) + 'px';
    });
    visRaf = requestAnimationFrame(drawVisualiser);
  }

  // ── WebSocket ─────────────────────────────────────────
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/voice`);

    ws.onopen = () => setStatus('Ready', false);
    ws.onclose = () => { setStatus('Disconnected', true); setTimeout(connect, 3000); };
    ws.onerror = () => setStatus('Connection error', true);

    ws.onmessage = async (evt) => {
      if (evt.data instanceof Blob) {
        // Audio response
        if (!muted) playAudio(evt.data);
        return;
      }
      const msg = JSON.parse(evt.data);
      if (msg.type === 'transcript') {
        addMessage('user', msg.text, msg.language ? `lang: ${msg.language}` : null);
      } else if (msg.type === 'reply') {
        pendingAudioReply = addMessage('ai', msg.text, msg.round_trip ? `${msg.round_trip}s` : null);
      } else if (msg.type === 'status') {
        addStatus(msg.message);
      } else if (msg.type === 'error') {
        addStatus(msg.message);
      }
    };
  }
  connect();

  // ── Audio playback ────────────────────────────────────
  function playAudio(blob) {
    const url = URL.createObjectURL(blob);
    const el = document.createElement('audio');
    el.src = url;
    el.controls = true;
    el.autoplay = true;
    el.style.cssText = 'margin-top:.5rem;width:100%;height:32px;border-radius:8px;filter:brightness(.8)';
    el.onended = () => URL.revokeObjectURL(url);
    if (pendingAudioReply) {
      pendingAudioReply.appendChild(el);
      pendingAudioReply = null;
      scrollDown();
    }
  }

  // ── Recording ─────────────────────────────────────────
  async function startRecording() {
    if (recording) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      addStatus('Microphone access denied');
      return;
    }
    recording = true;
    micBtn.classList.add('recording');
    visEl.classList.add('active');

    // Analyser for visualiser
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    source.connect(analyser);
    drawVisualiser();

    recorder = new MediaRecorder(stream, { mimeType: getSupportedMime() });
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: recorder.mimeType });
      if (ws && ws.readyState === WebSocket.OPEN && blob.size > 0) {
        ws.send(blob);
        addStatus('Processing...');
      }
    };
    recorder.start();
    setStatus('Recording...', false);
  }

  function stopRecording() {
    if (!recording) return;
    recording = false;
    micBtn.classList.remove('recording');
    visEl.classList.remove('active');
    if (visRaf) cancelAnimationFrame(visRaf);
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    analyser = null;
    setStatus('Ready', false);
  }

  function getSupportedMime() {
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  }

  // ── UI helpers ────────────────────────────────────────
  function addMessage(role, text, meta) {
    if (!hasMessages) { emptyState.style.display = 'none'; hasMessages = true; }
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    const label = role === 'user' ? 'You' : 'Voice Agent';
    el.innerHTML = `<span class="label">${label}</span>${escHtml(text)}${meta ? `<div class="meta">${escHtml(meta)}</div>` : ''}`;
    chatWrap.appendChild(el);
    scrollDown();
    return el;
  }

  function addStatus(text) {
    const el = document.createElement('div');
    el.className = 'msg status';
    el.textContent = text;
    chatWrap.appendChild(el);
    scrollDown();
  }

  function scrollDown() {
    requestAnimationFrame(() => chatWrap.scrollTop = chatWrap.scrollHeight);
  }

  function setStatus(text, isError) {
    statusPill.textContent = text;
    statusPill.classList.toggle('error', !!isError);
  }

  function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ── Events ────────────────────────────────────────────
  micBtn.addEventListener('mousedown', startRecording);
  micBtn.addEventListener('mouseup', stopRecording);
  micBtn.addEventListener('mouseleave', stopRecording);
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
  micBtn.addEventListener('touchend', stopRecording);

  // Click toggle fallback (tap once to start, tap again to stop)
  let clickMode = false;
  micBtn.addEventListener('click', (e) => {
    // Only activate click-toggle on fast taps (not hold)
    if (e.detail === 0) return; // keyboard
  });

  // Space bar push-to-talk
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && document.activeElement === document.body) { e.preventDefault(); startRecording(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') { e.preventDefault(); stopRecording(); }
  });

  clearBtn.addEventListener('click', () => {
    chatWrap.querySelectorAll('.msg').forEach(m => m.remove());
    emptyState.style.display = '';
    hasMessages = false;
  });

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    document.getElementById('speakerIcon').style.opacity = muted ? '.3' : '1';
  });
})();
</script>
</body>
</html>
