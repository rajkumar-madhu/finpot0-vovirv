apiVersion: v1
kind: Secret
metadata:
  name: voice-auth-secrets
  namespace: fs-linkedeye
  labels:
    app: voice-auth
    app.kubernetes.io/part-of: voice-saas
type: Opaque
stringData:
  JWT_SECRET: "voice-saas-jwt-secret-change-in-production-min32chars"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-auth
  namespace: fs-linkedeye
  labels:
    app: voice-auth
    app.kubernetes.io/part-of: voice-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-auth
  template:
    metadata:
      labels:
        app: voice-auth
        app.kubernetes.io/part-of: voice-saas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: voice-auth
          image: voice-saas/auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: PORT
              value: "4001"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgresql://linkedeye:linkedeye@postgres.fs-linkedeye.svc.cluster.local:5432/voice_auth"
            - name: REDIS_URL
              value: "redis://:REDIS_PASSWORD@redis.fs-linkedeye.svc.cluster.local:6379/1"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voice-auth-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: JWT_REFRESH_EXPIRES_IN
              value: "30d"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: voice-auth
  namespace: fs-linkedeye
  labels:
    app: voice-auth
    app.kubernetes.io/part-of: voice-saas
spec:
  type: ClusterIP
  selector:
    app: voice-auth
  ports:
    - port: 4001
      targetPort: 4001
      protocol: TCP
      name: http
