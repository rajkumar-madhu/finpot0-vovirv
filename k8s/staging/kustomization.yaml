---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: voice-saas-staging

namespace: voice-saas

# Base configuration
resources:
  - ../base

# Staging-specific labels
commonLabels:
  environment: staging

# Staging image tags
images:
  - name: voice-saas/auth
    newTag: staging
  - name: voice-saas/api-gateway
    newTag: staging
  - name: voice-saas/orchestrator
    newTag: staging
  - name: voice-saas/rag
    newTag: staging
  - name: voice-saas/stt
    newTag: staging
  - name: voice-saas/tts
    newTag: staging

# Staging-specific patches
patches:
  # Reduce replica counts for staging
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: orchestrator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: stt
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: tts
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Update HPA min replicas
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: HorizontalPodAutoscaler
      name: stt-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # Staging ingress host
  - target:
      kind: Ingress
      name: voice-saas-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-staging.voice-saas.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api-staging.voice-saas.example.com

# ConfigMap patches for staging
configMapGenerator:
  - name: staging-config
    behavior: create
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug
