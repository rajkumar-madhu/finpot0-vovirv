apiVersion: v1
kind: ServiceAccount
metadata:
  name: voice-saas-sa
  namespace: voice-saas
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voice-saas-ml
  namespace: voice-saas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voice-saas-role
  namespace: voice-saas
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voice-saas-rolebinding
  namespace: voice-saas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voice-saas-role
subjects:
  - kind: ServiceAccount
    name: voice-saas-sa
    namespace: voice-saas
  - kind: ServiceAccount
    name: voice-saas-ml
    namespace: voice-saas
