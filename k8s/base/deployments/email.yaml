apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  namespace: voice-saas
  labels:
    app: email
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4003"
    spec:
      containers:
        - name: email
          image: voice-saas/email:latest
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: voice-saas-config
            - secretRef:
                name: voice-saas-secrets
          env:
            - name: PORT
              value: "4003"
          volumeMounts:
            - name: attachments
              mountPath: /app/data/attachments
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: email-attachments-pvc
