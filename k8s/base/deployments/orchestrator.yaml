apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: voice-saas
  labels:
    app: orchestrator
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4002"
    spec:
      serviceAccountName: voice-saas-sa
      containers:
        - name: orchestrator
          image: voice-saas/orchestrator:latest
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: voice-saas-config
            - secretRef:
                name: voice-saas-secrets
          env:
            - name: PORT
              value: "4002"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
