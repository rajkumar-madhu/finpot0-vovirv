apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-saas-ingress
  namespace: voice-saas
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "webvoice"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.linkedeye.com
        - voice.linkedeye.com
        - flowise.linkedeye.com
      secretName: voice-saas-tls
  rules:
    # Main API Gateway
    - host: api.linkedeye.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
    # WebVoice Widget (WebSocket)
    - host: voice.linkedeye.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webvoice
                port:
                  number: 4004
    # Flowise Dashboard
    - host: flowise.linkedeye.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowise
                port:
                  number: 3000
