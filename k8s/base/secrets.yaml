---
# IMPORTANT: These are template secrets with placeholder values.
# In production, use SealedSecrets, External Secrets Operator, or Vault.
# NEVER commit actual secrets to version control!

# Database Credentials
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Replace with actual values in production
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres-svc.voice-saas-data.svc.cluster.local:5432/voice_saas"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME"
---
# Redis Credentials
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  REDIS_URL: "redis://redis-svc.voice-saas-data.svc.cluster.local:6379"
---
# JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  JWT_SECRET: "CHANGE_ME_GENERATE_SECURE_SECRET_MIN_32_CHARS"
---
# Anthropic API Key (for Flowise)
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-credentials
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: flowise
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-CHANGE_ME"
---
# Flowise Credentials
apiVersion: v1
kind: Secret
metadata:
  name: flowise-credentials
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: flowise
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  FLOWISE_USERNAME: "admin"
  FLOWISE_PASSWORD: "CHANGE_ME"
  DATABASE_USER: "postgres"
  DATABASE_PASSWORD: "CHANGE_ME"
---
# HuggingFace Token (for model downloads)
apiVersion: v1
kind: Secret
metadata:
  name: huggingface-token
  namespace: voice-saas
  labels:
    app.kubernetes.io/name: ml-services
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  HF_TOKEN: "hf_CHANGE_ME"
