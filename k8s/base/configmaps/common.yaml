apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-saas-config
  namespace: voice-saas
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  
  # Service URLs (internal K8s DNS)
  AUTH_SERVICE_URL: "http://auth-svc:4001"
  API_GATEWAY_URL: "http://api-gateway-svc:4000"
  ORCHESTRATOR_URL: "http://orchestrator-svc:4002"
  EMAIL_SERVICE_URL: "http://email-svc:4003"
  WEBVOICE_SERVICE_URL: "http://webvoice-svc:4004"
  STT_SERVICE_URL: "http://stt-svc:8001"
  TTS_SERVICE_URL: "http://tts-svc:8002"
  RAG_SERVICE_URL: "http://rag-svc:8003"
  FLOWISE_URL: "http://flowise-svc:3000"
  
  # Database (external service)
  DATABASE_HOST: "postgresql-svc.voice-saas-data.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "voice_saas"
  
  # Redis (external service)
  REDIS_HOST: "redis-svc.voice-saas-data.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # CORS
  ALLOWED_ORIGINS: "https://app.linkedeye.com,https://admin.linkedeye.com"
  
  # Audio settings
  AUDIO_SAMPLE_RATE: "16000"
  VAD_SILENCE_THRESHOLD_MS: "1500"
  
  # Session settings
  SESSION_TIMEOUT_SECONDS: "300"
  MAX_SESSION_DURATION_SECONDS: "1800"
  MAX_CONCURRENT_SESSIONS_PER_TENANT: "100"
  
  # IMAP/SMTP
  IMAP_POLL_INTERVAL_SECONDS: "60"
  SMTP_QUEUE_CONCURRENCY: "10"
  SMTP_MAX_RETRIES: "3"
  
  # STT settings
  STT_WHISPER_MODEL: "large-v3"
  STT_WHISPER_DEVICE: "cuda"
  STT_WHISPER_COMPUTE_TYPE: "float16"
  
  # TTS settings
  TTS_INDICF5_ENABLED: "true"
  TTS_INDICF5_DEVICE: "cuda"
  TTS_PIPER_ENABLED: "true"
