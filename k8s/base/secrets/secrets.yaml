apiVersion: v1
kind: Secret
metadata:
  name: voice-saas-secrets
  namespace: voice-saas
type: Opaque
stringData:
  # Database credentials (replace with actual values or use external secrets)
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgresql-svc.voice-saas-data.svc.cluster.local:5432/voice_saas"
  DATABASE_PASSWORD: "CHANGE_ME"
  
  # Redis
  REDIS_URL: "redis://:CHANGE_ME@redis-svc.voice-saas-data.svc.cluster.local:6379"
  REDIS_PASSWORD: "CHANGE_ME"
  
  # JWT secrets (generate with: openssl rand -base64 64)
  JWT_SECRET: "CHANGE_ME_GENERATE_A_SECURE_64_BYTE_SECRET"
  JWT_REFRESH_SECRET: "CHANGE_ME_GENERATE_A_SECURE_64_BYTE_SECRET"
  
  # Email encryption key (32 bytes hex)
  EMAIL_ENCRYPTION_KEY: "CHANGE_ME_64_HEX_CHARS_FOR_32_BYTES"
  
  # Webhook secret
  WEBHOOK_SECRET: "CHANGE_ME"
  
  # Flowise credentials
  FLOWISE_USERNAME: "admin"
  FLOWISE_PASSWORD: "CHANGE_ME"
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGE_ME"
  DB_HOST: "postgresql-svc.voice-saas-data.svc.cluster.local"

  # API keys for external services
  ANTHROPIC_API_KEY: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
---
